<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="버튼을 누르면 환영 메시지를 보여주는 간단한 GUI" />
    <title>환영 GUI</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">WELCOME</p>
        <h1 id="page-title">반갑습니다</h1>
        <p class="description">아래 버튼을 눌러 환영 메시지를 확인하세요.</p>
        <button id="welcome-button" type="button">환영 메시지 보기</button>
      </section>
    </main>
  </body>
</html>
